<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Retrouvez les albums photos des cours de ski de Gabriel, classés par semaine à La Rosière."
    />
    <meta name="theme-color" content="#c92338" />
    <title>Albums photos — Gabriel, moniteur de ski à La Rosière</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --red: #c92338;
        --red-dark: #a91d30;
        --ink: #25282c;
        --muted: #70767c;
        --paper: #fbfaf8;
        --white: #fff;
        --line: #e9e6e2;
        --sans: "Poppins", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--red);
        outline-offset: 4px;
      }

      .shell {
        width: min(1120px, calc(100% - 56px));
        margin-inline: auto;
      }

      .site-header {
        border-bottom: 1px solid var(--line);
      }

      .site-footer {
        border-top: 1px solid var(--line);
      }

      .navigation {
        display: flex;
        width: min(1120px, calc(100% - 56px));
        min-height: 82px;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
        margin-inline: auto;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }

      .brand-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 14px;
        letter-spacing: -0.02em;
      }

      .language-flags {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 3px;
        color: inherit;
        font-size: 12px;
        letter-spacing: 0;
        line-height: 1;
        text-transform: none;
      }

      .language-flags > span {
        display: inline-block;
        color: inherit;
        font-size: 12px;
        letter-spacing: 0;
        line-height: 1;
        text-transform: none;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: 10px;
      }

      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border: 1px solid var(--red);
        border-radius: 3px;
        background: var(--red);
        color: var(--white);
        font-size: 12px;
        font-weight: 750;
        text-decoration: none;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
        border-color: var(--red-dark);
        background: var(--red-dark);
      }

      .header-button {
        width: 112px;
        height: 48px;
        min-height: 48px;
        padding-inline: 8px;
        font-size: 12px;
      }

      main {
        flex: 1;
        padding-block: 48px 56px;
      }

      .page-intro {
        max-width: 650px;
        margin: 0 auto 32px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--red);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 10px;
        font-size: clamp(32px, 4vw, 48px);
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      h1 span {
        color: var(--red);
      }

      .intro {
        max-width: 520px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .album-grid {
        display: grid;
        max-width: 760px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-inline: auto;
      }

      .album-button {
        display: flex;
        aspect-ratio: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--white);
        color: var(--ink);
        font: inherit;
        text-align: center;
      }

      .album-button strong {
        color: var(--red);
        font-size: clamp(14px, 2.3vw, 20px);
        font-weight: 700;
      }

      .album-button span {
        color: var(--muted);
        font-size: 11px;
      }

      .album-button .album-date {
        display: grid;
        justify-items: center;
        gap: 4px;
      }

      .album-button .album-date-range {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: clamp(17px, 2.6vw, 22px);
      }

      .album-button .album-date-range span {
        color: var(--red);
        font-size: inherit;
      }

      .album-button .album-date-arrow {
        font-size: 16px;
      }

      .page-end {
        margin-top: 28px;
        text-align: center;
      }

      .back-link {
        color: var(--muted);
        font-size: 12px;
        text-decoration: none;
      }

      .back-link:hover {
        color: var(--red);
      }

      .footer-inner {
        display: flex;
        min-height: 82px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: var(--muted);
        font-size: 10px;
      }

      .footer-inner p {
        margin: 0;
      }

      @media (max-width: 850px) {
        .shell,
        .navigation {
          width: min(100% - 40px, 680px);
        }
      }

      @media (max-width: 700px) {
        .shell,
        .navigation {
          width: min(100% - 36px, 560px);
        }

        .navigation {
          flex-wrap: wrap;
          padding-block: 12px;
        }



        .header-actions {
          width: 100%;
          gap: 7px;
          margin-right: 0;
        }

        .header-button {
          width: auto;
          height: 48px;
          min-height: 48px;
          flex: 1;
          min-width: 0;
          padding-inline: 8px;
          font-size: 12px;
        }

        main {
          padding-block: 32px 40px;
        }

        .album-grid {
          gap: 10px;
        }
      }

      @media (max-width: 420px) {
        .album-button {
          gap: 5px;
          padding: 8px;
        }

        .album-button .album-date-range {
          gap: 3px;
          font-size: 10px;
        }

        .album-button .album-date-arrow {
          font-size: 12px;
        }

        .album-button span {
          font-size: 9px;
        }
      }

      @media (max-width: 620px) {
        .header-button {
          height: 48px;
          min-height: 48px;
          padding-inline: 8px;
          font-size: 12px;
        }

        .brand-title {
          gap: 5px;
          font-size: 12px;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="navigation shell">
        <a class="brand" href="index.html" aria-label="Accueil — Gabriel, moniteur de ski">
          <strong class="brand-title">

            <span class="language-flags" aria-label="Drapeaux français et britannique">
              <span role="img" aria-label="France">🇫🇷</span>

            </span>

        </a>
        <nav class="header-actions" aria-label="Navigation principale">
          <a class="button header-button" href="index.html">ACCUEIL</a>

          <a class="button header-button" href="a-propos.html">A PROPOS</a>
