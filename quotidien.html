<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Un aperçu du quotidien de Gabriel, moniteur de ski ESF à La Rosière : les cours, les élèves et la vie sur les pistes."
    />
    <meta name="theme-color" content="#c92338" />
    <title>Mon quotidien — Gabriel, moniteur de ski à La Rosière</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --red: #c92338;
        --red-dark: #a91d30;
        --ink: #25282c;
        --muted: #70767c;
        --paper: #fbfaf8;
        --white: #fff;
        --line: #e9e6e2;
        --sans: "Poppins", sans-serif;
        --serif: "Poppins", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 3px solid var(--red);
        outline-offset: 4px;
      }

      .shell {
        width: min(1120px, calc(100% - 56px));
        margin-inline: auto;
      }

      .site-header {
        border-bottom: 1px solid var(--line);
      }

      .site-footer {
        border-top: 1px solid var(--line);
      }

      .navigation {
        display: flex;
        width: min(1120px, calc(100% - 56px));
        min-height: 82px;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
        margin-inline: auto;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }

      .brand-copy {
        display: grid;
        gap: 3px;
      }

      .brand-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 14px;
        letter-spacing: -0.02em;
      }

      .language-flags {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 3px;
        color: inherit;
        font-size: 12px;
        letter-spacing: 0;
        line-height: 1;
        text-transform: none;
      }

      .language-flags > span {
        display: inline-block;
        color: inherit;
        font-size: 12px;
        letter-spacing: 0;
        line-height: 1;
        text-transform: none;
      }

      .brand-copy > span {
        color: var(--muted);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: 10px;
      }

      .button {
        display: inline-flex;
        height: 48px;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 20px;
        border: 1px solid var(--red);
        border-radius: 3px;
        background: var(--red);
        color: var(--white);
        font-size: 12px;
        font-weight: 750;
        text-decoration: none;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
        border-color: var(--red-dark);
        background: var(--red-dark);
      }

      .header-button {
        width: 112px;
        height: 48px;
        min-height: 48px;
        padding-inline: 8px;
        font-size: 12px;
      }

      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        padding-block: clamp(12px, 2vh, 24px);
      }

      .page-intro {
        max-width: 650px;
        margin: 0 auto clamp(12px, 2vh, 20px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--red);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-family: var(--sans);
        font-size: clamp(32px, 4vw, 48px);
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      h1 span {
        color: var(--red);
      }

      .intro {
        max-width: 520px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .gallery {
        position: relative;
        max-width: 900px;
        margin-inline: auto;
      }

      .gallery-item {
        display: flex;
        position: relative;
        justify-content: center;
        margin: 0;
        background: #eeeae5;
      }

      .gallery-item[hidden] {
        display: none;
      }

      .gallery-item img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: clamp(120px, min(40svh, calc(100svh - 420px)), 360px);
        cursor: zoom-in;
      }

      .gallery-controls[hidden] {
        display: none;
      }

      .gallery-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-top: 10px;
      }

      .slide-button {
        display: grid;
        width: 40px;
        height: 40px;
        min-height: 40px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--white);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        line-height: 1;
        transition:
          border-color 160ms ease,
          background 160ms ease,
          color 160ms ease;
      }

      .slide-button:hover {
        border-color: var(--red);
        background: var(--red);
        color: var(--white);
      }

      .slide-count {
        min-width: 44px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        text-align: center;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        width: 100%;
        max-width: none;
        height: 100%;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--white);
      }

      .lightbox::backdrop {
        background: rgb(0 0 0 / 94%);
      }

      .lightbox-content {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      .lightbox-image {
        display: block;
        width: auto;
        height: auto;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100svh;
        object-fit: contain;
        touch-action: pan-y;
      }

      .lightbox-button {
        position: absolute;
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 45%);
        border-radius: 50%;
        background: rgb(0 0 0 / 45%);
        color: var(--white);
        cursor: pointer;
        font: inherit;
        font-size: 28px;
        line-height: 1;
      }

      .lightbox-button:hover {
        background: rgb(0 0 0 / 75%);
      }

      .lightbox-close {
        top: 16px;
        right: 16px;
        font-size: 24px;
      }

      .lightbox-previous {
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
      }

      .lightbox-next {
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
      }

      .lightbox-count {
        position: absolute;
        right: 0;
        bottom: 18px;
        left: 0;
        color: var(--white);
        font-size: 13px;
        text-align: center;
      }

      .keyboard-hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }

      .page-end {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 16px;
      }

      @media (max-width: 620px) {
        .lightbox-button {
          width: 42px;
          height: 42px;
        }

        .lightbox-previous {
          left: 8px;
        }

        .lightbox-next {
          right: 8px;
        }
      }

      .back-link {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        gap: 10px;
        padding: 0 19px;
        border: 1px solid var(--red);
        border-radius: 3px;
        color: var(--red);
        font-size: 12px;
        font-weight: 750;
        text-decoration: none;
        transition:
          background 160ms ease,
          color 160ms ease;
      }

      .back-link:hover {
        background: var(--red);
        color: var(--white);
      }

      .footer-inner {
        display: flex;
        height: 82px;
        min-height: 82px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: var(--muted);
        font-size: 10px;
      }

      .footer-inner p {
        margin: 0;
      }

      @media (max-width: 850px) {
        .shell,
        .navigation {
          width: min(100% - 40px, 680px);
        }
      }

      @media (max-width: 700px) {
        .shell {
          width: min(100% - 36px, 560px);
        }

        .brand {
          margin-inline: auto;
        }

        .navigation {
          width: min(100% - 36px, 560px);
          flex-wrap: wrap;
          padding-block: 12px;
        }



        .header-actions {
          width: 100%;
          gap: 7px;
          margin-right: 0;
        }

        .header-button {
          width: auto;
          height: 48px;
          min-height: 48px;
          flex: 1;
          min-width: 0;
          padding-inline: 8px;
          font-size: 12px;
        }
      }

      @media (max-width: 620px) {
        .navigation {
          min-height: 70px;
        }

        .brand-title {
          gap: 5px;
          font-size: 12px;
        }

        .page-intro {
          margin-bottom: 12px;
        }

      }

      @media (max-height: 760px) {
        main {
          padding-block: 8px;
        }

        .page-intro {
          margin-bottom: 10px;
        }

        .eyebrow {
          margin-bottom: 6px;
        }

        h1 {
          font-size: clamp(26px, 4vw, 38px);
        }

        .intro {
          font-size: 12px;
          line-height: 1.45;
        }

        .page-end {
          margin-top: 10px;
        }
      }

      @media (max-height: 620px) {
        .navigation {
          padding-block: 6px;
        }

        .footer-inner {
          height: 64px;
          min-height: 64px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

    <script>
      const slideshow = document.querySelector("#daily-slideshow");

      if (slideshow) {
        const slides = Array.from(slideshow.querySelectorAll(".gallery-item"));
        const controls = slideshow.querySelector(".gallery-controls");
        const counter = slideshow.querySelector(".slide-count");
        const lightbox = document.querySelector(".lightbox");
        const lightboxImage = lightbox.querySelector(".lightbox-image");
        const lightboxCount = lightbox.querySelector(".lightbox-count");
        const closeLightboxButton = lightbox.querySelector(".lightbox-close");
        let currentSlide = 0;
        let touchStart = null;

        const showSlide = (index) => {
          currentSlide = (index + slides.length) % slides.length;
          slides.forEach((slide, slideIndex) => {
            slide.hidden = slideIndex !== currentSlide;
          });
          counter.textContent = `${currentSlide + 1} / ${slides.length}`;
          slides[currentSlide].setAttribute(
            "aria-label",
            `Agrandir la photo ${currentSlide + 1} sur ${slides.length}`,
          );
          if (lightbox.open) {
            const image = slides[currentSlide].querySelector("img");
            lightboxImage.src = image.currentSrc || image.src;
            lightboxImage.alt = image.alt;
            lightboxCount.textContent = `${currentSlide + 1} / ${slides.length}`;
          }
        };

        const openLightbox = (slide) => {
          lightbox.showModal();
          showSlide(slides.indexOf(slide));
          closeLightboxButton.focus();
        };

        slides.forEach((slide, index) => {
          slide.setAttribute("role", "button");
          slide.setAttribute("tabindex", "0");
          slide.setAttribute("aria-haspopup", "dialog");
          slide.setAttribute(
            "aria-label",
            `Agrandir la photo ${index + 1} sur ${slides.length}`,
          );
          slide.addEventListener("click", () => openLightbox(slide));
          slide.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openLightbox(slide);
            }
          });
        });

        lightbox.querySelector(".lightbox-previous").addEventListener("click", () => {
          showSlide(currentSlide - 1);
        });
        lightbox.querySelector(".lightbox-next").addEventListener("click", () => {
          showSlide(currentSlide + 1);
        });
        closeLightboxButton.addEventListener("click", () => lightbox.close());
        lightbox.addEventListener("click", (event) => {
          if (event.target === lightbox) {
            lightbox.close();
          }
        });
        lightbox.addEventListener("close", () => {
          slides[currentSlide].focus();
        });
        lightboxImage.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "touch") {
            touchStart = { x: event.clientX, y: event.clientY };
          }
        });
        lightboxImage.addEventListener("pointerup", (event) => {
          if (!touchStart || event.pointerType !== "touch") {
            return;
          }
          const deltaX = event.clientX - touchStart.x;
          const deltaY = event.clientY - touchStart.y;
          if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
            showSlide(currentSlide + (deltaX < 0 ? 1 : -1));
          }
          touchStart = null;
        });
        lightboxImage.addEventListener("pointercancel", () => {
          touchStart = null;
        });

        controls.hidden = false;
        controls.addEventListener("click", (event) => {
          const button = event.target.closest("[data-direction]");
          if (button) {
            showSlide(currentSlide + Number(button.dataset.direction));
          }
        });

        document.addEventListener("keydown", (event) => {
          if (lightbox.open && event.key === "Escape") {
            event.preventDefault();
            lightbox.close();
            return;
          }

          if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
            if (lightbox.open) {
              event.preventDefault();
              showSlide(currentSlide + (event.key === "ArrowRight" ? 1 : -1));
              return;
            }

            const target = event.target;
            const isEditing =
              target instanceof HTMLElement &&
              (target.isContentEditable ||
                target instanceof HTMLInputElement ||
                target instanceof HTMLTextAreaElement ||
                target instanceof HTMLSelectElement);
            const galleryBounds = slideshow.getBoundingClientRect();
            const galleryIsVisible =
              galleryBounds.bottom > 0 && galleryBounds.top < window.innerHeight;

            if (isEditing || !galleryIsVisible || event.altKey || event.ctrlKey || event.metaKey) {
              return;
            }

            event.preventDefault();
            showSlide(currentSlide + (event.key === "ArrowRight" ? 1 : -1));
          }
        });
      }
    </script>
