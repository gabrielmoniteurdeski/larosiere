<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Contactez Gabriel, moniteur de ski ESF à La Rosière, pour vos cours et toute question."
    />
    <meta name="theme-color" content="#c92338" />
    <title>Contact — Gabriel, moniteur de ski à La Rosière</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --red: #c92338;
        --red-dark: #a91d30;
        --ink: #25282c;
        --muted: #70767c;
        --paper: #fbfaf8;
        --white: #fff;
        --line: #e9e6e2;
        --sans: "Poppins", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 3px solid var(--red);
        outline-offset: 4px;
      }

      .shell {
        width: min(1120px, calc(100% - 56px));
        margin-inline: auto;
      }

      .site-header {
        border-bottom: 1px solid var(--line);
      }

      .navigation {
        display: flex;
        min-height: 82px;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
        margin-inline: auto;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }

      .brand-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 14px;
        letter-spacing: -0.02em;
      }

      .language-flags {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 3px;
        color: inherit;
        font-size: 12px;
        letter-spacing: 0;
        line-height: 1;
        text-transform: none;
      }

      .language-flags > span {
        display: inline-block;
        color: inherit;
        font-size: 12px;
        letter-spacing: 0;
        line-height: 1;
        text-transform: none;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: 10px;
      }

      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 20px;
        border: 1px solid var(--red);
        border-radius: 3px;
        background: var(--red);
        color: var(--white);
        font-size: 12px;
        font-weight: 750;
        text-decoration: none;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
        border-color: var(--red-dark);
        background: var(--red-dark);
      }

      .header-button {
        width: 112px;
        padding-inline: 8px;
      }

      main {
        display: grid;
        flex: 1;
        place-items: center;
        padding-block: 48px;
      }

      .contact {
        padding: clamp(30px, 6vw, 64px);
        border: 1px solid var(--line);
        background: var(--white);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--red);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 auto 16px;
        font-size: clamp(36px, 5.5vw, 54px);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      h1 span {
        color: var(--red);
      }

      .contact-description {
        max-width: 480px;
        margin: 0 auto 24px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.9;
      }

      .contact-button {
        min-height: 52px;
      }

      .contact-email {
        margin: 16px 0 0;
        font-size: 14px;
        font-weight: 600;
      }

      .contact-email a {
        text-decoration-color: var(--line);
        text-underline-offset: 4px;
      }

      .contact-email a:hover {
        color: var(--red);
        text-decoration-color: currentColor;
      }

      .site-footer {
        height: 83px;
        border-top: 1px solid var(--line);
      }

      .footer-inner {
        display: flex;
        height: 82px;
        min-height: 82px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: var(--muted);
        font-size: 10px;
      }

      .footer-inner p {
        margin: 0;
      }

      @media (max-width: 850px) {
        .shell,
        .navigation {
          width: min(100% - 40px, 680px);
        }
      }

      @media (max-width: 700px) {
        .shell,
        .navigation {
          width: min(100% - 36px, 560px);
        }

        .brand {
          margin-inline: auto;
        }

        .navigation {
          flex-wrap: wrap;
          padding-block: 12px;
        }



        .header-actions {
          width: 100%;
          gap: 7px;
          margin-right: 0;
        }

        .header-button {
          width: auto;
          flex: 1;
          min-width: 0;
          padding-inline: 8px;
          font-size: 12px;
        }

        main {
          padding-block: 40px;
        }
      }

      @media (max-width: 620px) {
        .navigation {
          min-height: 70px;
        }

        .brand-title {
          gap: 5px;
          font-size: 12px;
        }

        .contact {
          padding: 34px 22px;
        }

        .contact-description {
          font-size: 13px;
        }

        .footer-inner {
          height: auto;
          min-height: 58px;
        }

        .site-footer {
          height: auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="navigation shell">
        <a class="brand" href="index.html" aria-label="Accueil — Gabriel, moniteur de ski">
          <strong class="brand-title">
            Gabriel · Moniteur de ski
            <span class="language-flags" aria-label="Drapeaux français et britannique">
              <span role="img" aria-label="France">🇫🇷</span>
              <span role="img" aria-label="Grande-Bretagne">🇬🇧</span>
            </span>
          </strong>
        </a>
        <nav class="header-actions" aria-label="Navigation principale">
          <a class="button header-button" href="index.html">ACCUEIL</a>
          <a class="button header-button" href="albums.html">PHOTOS</a>
          <a class="button header-button" href="a-propos.html">A PROPOS</a>
          <a class="button header-button" href="contact.html" aria-current="page">CONTACT</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="contact shell" aria-labelledby="contact-title">
        <p class="eyebrow">Gabriel · Moniteur à La Rosière</p>
        <h1 id="contact-title">Parlons de votre <span>prochain cours!</span></h1>
        <p class="contact-description">
          Une question ou une envie de réserver un cours de ski&nbsp;? Écrivez-moi.
        </p>
        <a class="button contact-button" href="mailto:veillon98@gmail.com?subject=Demande%20de%20cours%20de%20ski">
          M’ÉCRIRE <span aria-hidden="true">↗</span>
        </a>
        <p class="contact-email">
          <a href="mailto:veillon98@gmail.com">veillon98@gmail.com</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner shell">
        <p>La Rosière</p>
        <p>© Tous droits réservés</p>
      </div>
    </footer>
  </body>
</html>
